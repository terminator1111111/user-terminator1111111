<h1>Programming Survery</h1>

<form action="#" method="post" style="background: #3F4444;padding: 10px;">
    <label for="fullname">Enter First and Last Name:</label><br>
    <input type="text" id="fullname"><br>
    <label for="test score"> Latest Annual FEDERAL IQ Test Score:</label><br>
    <input type="number" id="test score" min="0" max="300"><br>
        <label for="number"> Latest Annual FEDERAL COMBAT FITNESS Test Score:</label><br>
    <input type="number" id="test score" min="0" max="300"><br>
    <label for="Contract">Select Warfighter Model:</label><br>
